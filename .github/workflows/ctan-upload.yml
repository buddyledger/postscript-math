name: CTAN upload

# Run by hand from the Actions tab (or: gh workflow run ctan-upload.yml).
# "validate" is a dry run: CTAN checks the archive and fields, nothing is stored.
# "upload" submits the package to the CTAN upload managers for review.
# See RELEASING.md.
#
# Required repository secrets:
#   CTAN_UPLOADER  name of the person uploading
#   CTAN_EMAIL     their email address (CTAN replies to it)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate = dry run, upload = really submit to CTAN"
        type: choice
        options: [validate, upload]
        default: validate
      update:
        description: "false for the first upload of the package, true for later versions"
        type: choice
        options: ["false", "true"]
        default: "false"
      announcement:
        description: "Announcement text for the CTAN mailing list (empty = no announcement)"
        type: string
        required: false
      note:
        description: "Private note to the CTAN upload managers"
        type: string
        required: false

permissions:
  contents: read

env:
  PKG: pst-numeric
  CTAN_PATH: /graphics/pstricks/contrib/pst-numeric
  CTAN_API: https://www.ctan.org/submit/1.1

jobs:
  ctan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and check the CTAN archive
        id: build
        run: |
          python3 tools/make-ctan.py
          v=$(sed -n 's/^[\]def[\]fileversion{\([^}]*\)}.*/\1/p' tex/pst-numeric.tex | head -n 1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Keep archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pst-numeric-${{ steps.build.outputs.version }}
          path: build/pst-numeric.zip

      - name: Send to CTAN (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
          UPDATE: ${{ inputs.update }}
          VERSION: ${{ steps.build.outputs.version }}
          ANNOUNCEMENT: ${{ inputs.announcement }}
          NOTE: ${{ inputs.note }}
          UPLOADER: ${{ secrets.CTAN_UPLOADER }}
          EMAIL: ${{ secrets.CTAN_EMAIL }}
        run: |
          if [ -z "$UPLOADER" ] || [ -z "$EMAIL" ]; then
            echo "::error::Set the repository secrets CTAN_UPLOADER and CTAN_EMAIL first."
            exit 1
          fi
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

          submit() {
            # $1 = validate | upload. Prints CTAN's messages, fails on any error.
            code=$(curl -sS -o response.json -w '%{http_code}' \
              --form-string "update=$UPDATE" \
              --form-string "pkg=$PKG" \
              --form-string "version=$VERSION" \
              --form-string "author=Buddy Ledger" \
              --form-string "uploader=$UPLOADER" \
              --form-string "email=$EMAIL" \
              --form-string "ctanPath=$CTAN_PATH" \
              --form-string "license=lppl1.3c" \
              --form-string "summary=Arbitrary precision arithmetic, matrices, complex numbers and numerical methods for PSTricks" \
              --form-string "description=pst-numeric is a library of PostScript procedures for PSTricks. Its decimal numbers carry as many significant digits as asked for, with arithmetic, square roots, exponentials, logarithms, trigonometric and hyperbolic functions, factorials and binomial coefficients. On top of that it has matrices (determinant, inverse, linear systems, least squares, symmetric eigenvalues), complex numbers, roots of functions, integrals and polynomials (values, roots, fitting), each working on ordinary reals or on the decimal numbers. The calculations run in the PostScript interpreter while the page is drawn, so they can feed plots directly. The parts are separate dvips headers, chosen by package options." \
              --form-string "home=$repo" \
              --form-string "repository=$repo" \
              --form-string "bugtracker=$repo/issues" \
              --form-string "announcement=$ANNOUNCEMENT" \
              --form-string "note=$NOTE" \
              -F "file=@build/$PKG.zip" \
              "$CTAN_API/$1")
            echo "CTAN $1 responded with HTTP $code"
            jq -r '.[] | "\(.[0]): \(.[1:] | map(tostring) | join(" | "))"' response.json 2>/dev/null || cat response.json
            echo
            if [ "$code" != "200" ] || grep -q '"ERROR"' response.json; then
              echo "::error::CTAN $1 failed (HTTP $code)"
              return 1
            fi
          }

          # Always validate first; only upload if validation is clean.
          submit validate
          if [ "$MODE" = "upload" ]; then
            submit upload
            if ! grep -q 'Upload succeeded' response.json; then
              echo "::error::CTAN did not confirm the upload"
              exit 1
            fi
          fi
